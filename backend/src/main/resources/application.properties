spring.application.name=playtesting-platform

# PostgreSQL local. Sobrescribir con variables de entorno cuando sea necesario.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/playtesting_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:2005}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# schema.sql se ejecuta al iniciar; data_seed.sql se ejecuta manualmente.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

app.jwt.secret=${JWT_SECRET:cGxheXRlc3RpbmctcGxhdGZvcm0ta2V5LW11c3QtYmUtbG9uZy1lbm91Z2gtZm9yLWhzMjU2}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}
app.storage.games-dir=${GAMES_STORAGE_DIR:uploads/games}
